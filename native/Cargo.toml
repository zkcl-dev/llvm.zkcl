[package]
name = "zkcl-llvm-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Owned LLVM IR handles, object emission, ORC JIT, and host FFI symbols for zkcl"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
inkwell = { version = "0.11", features = ["llvm21-1-prefer-dynamic"] }
llvm-sys = "211.1"
num-bigint = "0.4.6"
object = { version = "0.37.3", default-features = false, features = ["read"] }
self_cell = "1"
thiserror = "2"

[lints.clippy]
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
manual_instant_elapsed = "warn"
manual_is_multiple_of = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
